<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreeKitHub - Free Online Tools</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin: 8px 0 0;
      color: #d1d5db;
    }

    .hero {
      padding: 45px 20px 25px;
    }

    .hero h2 {
      font-size: 30px;
      margin: 0 0 12px;
    }

    .hero p {
      color: #666;
      font-size: 17px;
    }

    .tools {
      max-width: 1000px;
      margin: auto;
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .tool-card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .tool-card h3 {
      margin-top: 0;
    }

    .tool-card p {
      color: #666;
      line-height: 1.5;
    }

    .coming {
      margin-top: 12px;
      color: #888;
      font-size: 14px;
    }

    footer {
      margin-top: 30px;
      padding: 25px 15px;
      background: #111827;
      color: #d1d5db;
    }
  </style>
</head>

  <header>
    <h1>FreeKitHub</h1>
    <p>Free, Simple & Useful Online Tools</p>

  </section>
